name: professional-services-medical-web

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE with an immutable full-SHA tag is required}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
    expose:
      - "3000"
    networks:
      edge:
        aliases:
          - web
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: caddy:${CADDY_IMAGE_TAG:?CADDY_IMAGE_TAG is required}
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  edge:
    name: professional-services-edge
    external: true

volumes:
  caddy-data:
  caddy-config:
