name: professional-services-medical-web

services:
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE with an immutable full-SHA tag is required}
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8080
    expose:
      - "3000"
    networks:
      edge:
        aliases:
          - web
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  caddy:
    image: ${CADDY_IMAGE:?CADDY_IMAGE with an immutable full-SHA tag is required}
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -T, "3", -O, /dev/null, "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 10s
    depends_on:
      - web
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  edge:
    name: ${EDGE_NETWORK:-professional-services-edge}
    external: true

volumes:
  caddy-data:
  caddy-config:
